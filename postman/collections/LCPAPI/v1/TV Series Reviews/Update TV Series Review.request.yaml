$kind: http-request
name: Update TV Series Review
method: PUT
url: '{{baseUrl}}/api/tvseries/reviews/{{id}}'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reviewId": 0,
      "tvseriesId": 0,
      "username": "string",
      "reviewText": "string",
      "rating": 0
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
