$kind: http-request
name: Delete TV Series Review
method: DELETE
url: '{{baseUrl}}/api/tvseries/reviews/{{id}}'
order: 5000
auth:
  type: noauth
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
