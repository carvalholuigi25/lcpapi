$kind: http-request
name: Update Setting
method: PUT
url: '{{baseUrl}}/api/settings/{{id}}'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "settingsId": 0,
      "themeSettingName": "string",
      "realDataTimeEnabled": false,
      "isDarkMode": false,
      "autoRefreshInterval": 0,
      "notificationsEnabled": false,
      "enableLogging": false
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
