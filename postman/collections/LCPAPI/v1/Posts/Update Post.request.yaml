$kind: http-request
name: Update Post
method: PUT
url: '{{baseUrl}}/api/posts/{{id}}'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": 0,
      "title": "string",
      "content": "string"
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
