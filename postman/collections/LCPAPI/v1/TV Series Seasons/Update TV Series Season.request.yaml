$kind: http-request
name: Update TV Series Season
method: PUT
url: '{{baseUrl}}/api/tvseries/seasons/{{id}}'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "seasonId": 0,
      "tvseriesId": 0,
      "seasonNumber": 0,
      "title": "string",
      "description": "string",
      "releaseDate": "2024-01-01T00:00:00"
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
