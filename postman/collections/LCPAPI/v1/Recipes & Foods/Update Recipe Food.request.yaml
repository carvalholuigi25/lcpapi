$kind: http-request
name: Update Recipe Food
method: PUT
url: '{{baseUrl}}/api/recipesfoods/{{id}}'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "recipesFoodsId": 0,
      "title": "string",
      "description": "string",
      "image": "string",
      "ingredients": "string",
      "instructions": "string",
      "isFeatured": false
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 204", () => {
            pm.response.to.have.status(204);
        });

        pm.test("Response body is empty", () => {
            pm.expect(pm.response.text()).to.be.empty;
        });
