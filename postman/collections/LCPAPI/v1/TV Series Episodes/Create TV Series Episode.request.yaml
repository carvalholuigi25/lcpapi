$kind: http-request
name: Create TV Series Episode
method: POST
url: '{{baseUrl}}/api/tvseries/episodes'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tvseriesId": 0,
      "seasonId": 0,
      "episodeNumber": 0,
      "title": "string",
      "description": "string",
      "duration": 0
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 201", () => {
            pm.response.to.have.status(201);
        });

        pm.test("Response is JSON", () => {
            pm.response.to.be.json;
        });

        pm.test("Created resource has an ID", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("episodeId");
            pm.expect(json.episodeId).to.be.a("number").and.above(0);
        });

        pm.test("Created resource has required fields", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("title");
        });
