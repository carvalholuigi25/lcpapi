$kind: http-request
name: Create Music
method: POST
url: '{{baseUrl}}/api/musics'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "string",
      "description": "string",
      "image": "string",
      "artwork": "string",
      "artist": "string",
      "album": "string",
      "isFeatured": false,
      "scoreRating": 0,
      "releaseDate": "2024-01-01T00:00:00",
      "genre": [],
      "format": []
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is 201", () => {
            pm.response.to.have.status(201);
        });

        pm.test("Response is JSON", () => {
            pm.response.to.be.json;
        });

        pm.test("Created resource has an ID", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("musicId");
            pm.expect(json.musicId).to.be.a("number").and.above(0);
        });

        pm.test("Created resource has required fields", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("title");
        });
